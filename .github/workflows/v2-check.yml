name: Validate Op-Shop-Hop v2
on:
  push:
    branches: [feature/op-shop-hop-v2]
    paths:
      - app-v2.js
      - styles-v2.css
      - index.html
      - .github/workflows/v2-check.yml
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: node --check app-v2.js
      - name: Structural and behaviour assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          js=Path('app-v2.js').read_text()
          html=Path('index.html').read_text()
          css=Path('styles-v2.css').read_text()
          ids=set(re.findall(r'id="([^"]+)"',html))
          refs=set(re.findall(r'\$\("([^"]+)"\)',js))
          dynamic={'reviewNotes','reviewTagInput'}
          missing=sorted(refs-ids-dynamic)
          assert not missing, f'Missing static HTML IDs used by JS: {missing}'
          assert 'maplibregl.Map' in js
          assert 'leaflet' not in html.lower()
          assert 'Map + list' not in html
          assert 'Near me' in html and 'Inner Melbourne' in html and '>Melbourne<' in html and '>Victoria<' in html
          assert 'locationPrompt' in html and 'Use my location' in html and 'Browse without location' in html
          assert 'prefs.scope="near"' in js
          assert 'prefs.scope="metro"' in js
          assert 'prefs.locationChoice="use"' in js and 'prefs.locationChoice="browse"' in js
          assert 'distanceFromOrigin(p)<=Number(prefs.radius||5)' in js
          assert 'const features=filtered.filter' in js
          assert 'mapCount' in js and 'features.length' in js
          assert 'Mapped location' not in js
          assert 'address not listed' in js
          assert 'places-circles' in js
          assert 'prefs.layers' in js
          assert 'operator' not in re.search(r'function renderCards\(\).*?function tagGlyph',js,re.S).group(0).split('place-type')[1].split('card-actions')[0]
          assert html.index('id="map"') < html.index('id="placeList"')
          assert '#map' in css and 'body.map-hidden .map-panel' in css
          print('v2 structural and behaviour assertions passed')
          PY
