name: Correct Op-Shop-Hop map sizing rule v1.3.2
on:
  push:
    branches: [feature/map-address-v1-3-2]
    paths:
      - .github/workflows/fix-map-css-v132.yml
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Correct CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('styles.css')
          s=p.read_text()
          s=s.replace('#map.leaflet-container{width:100%;height:100%;min-width:0;overflow:hidden}', '#map.leaflet-container{width:100%;min-width:0;overflow:hidden}')
          p.write_text(s)
          PY
      - name: Assertions
        run: |
          grep -q '#map.leaflet-container{width:100%;min-width:0;overflow:hidden}' styles.css
          ! grep -q '#map.leaflet-container{width:100%;height:100%' styles.css
          node --check app.js
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          git diff --cached --quiet || git commit -m "Correct responsive map height rule"
          git push
