name: Apply map-first follow-up

on:
  push:
    branches:
      - feature/op-shop-hop-v1
    paths:
      - scripts/patch_mapfirst_followup.py
      - .github/workflows/patch-mapfirst-followup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/op-shop-hop-v1
      - run: python scripts/patch_mapfirst_followup.py
      - run: node --check app.js
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- app.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app.js
          git commit -m "Make first run map-first and auto-scope location"
          git push origin HEAD:feature/op-shop-hop-v1
