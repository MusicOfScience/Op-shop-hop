name: Fix v1.2 cafe origin

on:
  push:
    branches:
      - feature/layers-v1-2-patch
    paths:
      - scripts/fix_cafe_origin_v12.py
      - .github/workflows/fix-cafe-origin-v12.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/layers-v1-2-patch
      - run: python scripts/fix_cafe_origin_v12.py
      - run: node --check app.js
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- app.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app.js
          git commit -m "Fix cafe layer around selected location"
          git push origin HEAD:feature/layers-v1-2-patch
