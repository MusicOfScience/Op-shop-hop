name: Fix Op-Shop-Hop v2 normalize startup
on:
  push:
    branches: [feature/op-shop-hop-v2]
    paths:
      - .github/workflows/v2-fix-normalize.yml
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Hoist normalize helper
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app-v2.js')
          s=p.read_text()
          old='  const normalize = s => String(s || "").toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g," ").trim();'
          new='  function normalize(s){return String(s || "").toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g," ").trim();}'
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
      - name: Syntax check
        run: node --check app-v2.js
      - name: Commit fix
        run: |
          git config user.name "Mx Hud Harding"
          git config user.email "58031940+MusicOfScience@users.noreply.github.com"
          git add app-v2.js
          git commit -m "Fix v2 canonical-data startup order"
          git push
