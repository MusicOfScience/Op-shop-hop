name: Apply Op-Shop-Hop v1.1 patch

on:
  push:
    branches:
      - feature/op-shop-hop-v1
    paths:
      - scripts/patch_v11.py
      - .github/workflows/patch-v11.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/op-shop-hop-v1
      - name: Apply deterministic patch
        run: python scripts/patch_v11.py
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Commit patched app if needed
        shell: bash
        run: |
          if git diff --quiet -- app.js; then
            echo "No app.js changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app.js
          git commit -m "Fix review persistence and add map location search"
          git push origin HEAD:feature/op-shop-hop-v1
