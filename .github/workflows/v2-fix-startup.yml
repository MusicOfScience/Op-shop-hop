name: Fix Op-Shop-Hop v2 startup
on:
  push:
    branches: [feature/op-shop-hop-v2]
    paths:
      - .github/workflows/v2-fix-startup.yml
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Hoist clone helper
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app-v2.js')
          s=p.read_text()
          old='  const clone = x => JSON.parse(JSON.stringify(x));'
          new='  function clone(x){return JSON.parse(JSON.stringify(x));}'
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
      - name: Syntax check
        run: node --check app-v2.js
      - name: Commit fix
        run: |
          git config user.name "Mx Hud Harding"
          git config user.email "58031940+MusicOfScience@users.noreply.github.com"
          git add app-v2.js
          git commit -m "Fix v2 startup initialization order"
          git push
