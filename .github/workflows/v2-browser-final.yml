name: Final browser verification Op-Shop-Hop v2
on:
  push:
    branches: [feature/op-shop-hop-v2]
    paths:
      - .github/workflows/v2-browser-final.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax and structural check
        run: |
          node --check app-v2.js
          python - <<'PY'
          from pathlib import Path
          s=Path('app-v2.js').read_text()
          assert 'function clone(x)' in s
          assert 'Mapped location' not in s
          assert 'maplibregl.Map' in s
          PY
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --silent
          npx playwright install --with-deps chromium
      - name: Verify mobile startup, map and list
        run: |
          python3 -m http.server 4173 >/tmp/osh-server.log 2>&1 &
          cat > smoke.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
          const errors=[]; const consoleErrors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:30000});
          await page.waitForTimeout(1800);
          const prompt=await page.locator('#locationPrompt').evaluate(el=>({open:el.open}));
          if(!prompt.open){
            await page.screenshot({path:'v2-mobile-final.png',fullPage:true});
            throw new Error(`Prompt did not open. pageErrors=${errors.join(' | ')} consoleErrors=${consoleErrors.join(' | ')}`);
          }
          await page.click('#browseWithoutBtn');
          await page.waitForSelector('.place-card',{timeout:15000});
          await page.waitForSelector('#map canvas',{timeout:15000});
          await page.waitForTimeout(800);
          const mapBox=await page.locator('#map').boundingBox();
          const canvasBox=await page.locator('#map canvas').first().boundingBox();
          const cards=await page.locator('.place-card').count();
          const mapped=await page.locator('#mapCount').innerText();
          const firstCard=await page.locator('.place-card').first().innerText();
          if(!mapBox||mapBox.width<350||mapBox.height<300) throw new Error(`Bad map box ${JSON.stringify(mapBox)}`);
          if(!canvasBox||canvasBox.width<350||canvasBox.height<300) throw new Error(`Bad map canvas ${JSON.stringify(canvasBox)}`);
          if(cards<1) throw new Error('No cards rendered');
          if(!/\d+ plotted/.test(mapped)) throw new Error(`Bad plotted count: ${mapped}`);
          if(/Mapped location/i.test(firstCard)) throw new Error('Legacy mapped-location label survived');
          if(errors.length) throw new Error(`Page errors: ${errors.join(' | ')}`);
          await page.screenshot({path:'v2-mobile-final.png',fullPage:true});
          console.log(JSON.stringify({cards,mapped,mapBox,canvasBox,firstCard:firstCard.slice(0,220)}));
          await browser.close();
          JS
          node smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-mobile-final
          path: v2-mobile-final.png
