name: Fix Op-Shop-Hop map and addresses v1.3.2
on:
  push:
    branches: [feature/map-address-v1-3-2]
    paths:
      - scripts/fix_map_address_v132.py
      - .github/workflows/fix-map-address-v132.yml
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/fix_map_address_v132.py
      - name: JavaScript syntax
        run: node --check app.js
      - name: Behaviour assertions
        run: |
          grep -q 'let baseTiles = null' app.js
          grep -q 'function healMapTiles' app.js
          grep -q 'function enrichMissingSuburbs' app.js
          grep -q 'function displayAddress' app.js
          grep -q 'node.querySelector(".shop-address").textContent=displayAddress(s)' app.js
          ! grep -q 'leaflet-tile-container{will-change:transform}' styles.css
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js styles.css
          git diff --cached --quiet || git commit -m "Fix Safari map tiles and normalise suburb addresses"
          git push
